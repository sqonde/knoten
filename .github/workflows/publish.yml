name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      # Build + test with bun (the project's toolchain).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bun run verify:dist

      # Publish with npm: bun publish does not support OIDC trusted publishing.
      # Trusted publishing needs npm >= 11.5.1 and the id-token: write permission
      # above, plus a trusted publisher configured for this package on npmjs.com.
      # No NPM_TOKEN required — auth is the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
